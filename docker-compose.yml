services:
  icewarp:
    image: icewarptechnology/icewarp-server:14.3.0.12
    container_name: icewarp
    hostname: ${ICEWARP_PUBLIC_HOSTNAME:?set ICEWARP_PUBLIC_HOSTNAME in .env}
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/icewarp/config:/opt/icewarp-data/config
      - /opt/icewarp/mail:/opt/icewarp-data/mail
      - /opt/icewarp/logs:/opt/icewarp-data/logs
      - /opt/icewarp/spam:/opt/icewarp-data/spam
      - /opt/icewarp/archive:/opt/icewarp-data/archive
      - /opt/icewarp/backup:/opt/icewarp-data/backup
      - /opt/icewarp/temp:/opt/icewarp-data/temp
    environment:
      - ICEWARP_ADMIN_USER=${ICEWARP_ADMIN_USER:-admin}
      - ICEWARP_ADMIN_PASS=${ICEWARP_ADMIN_PASS:?set ICEWARP_ADMIN_PASS in .env}
      - ICEWARP_DOMAIN=${ICEWARP_DOMAIN:?set ICEWARP_DOMAIN in .env}
      - ICEWARP_PUBLIC_HOSTNAME=${ICEWARP_PUBLIC_HOSTNAME:?set ICEWARP_PUBLIC_HOSTNAME in .env}
      - MARIADB_HOST=${MARIADB_HOST:-127.0.0.1}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_ROOT_USER=${MARIADB_ROOT_USER:-icewarp}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
