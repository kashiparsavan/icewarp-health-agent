###############################################################################
#
# Agent Configuration
#
###############################################################################

AGENT_VERSION="0.6.0"

# IceWarp checklist edition referenced by both PDF reports.
CHECKLIST_VERSION="1.14"

MONITOR_URL=""

SEND_DATA=0

ICEWARP_HOME="/opt/icewarp"

OUTPUT_JSON="${PROJECT_ROOT}/output/health.json"

# Per-call timeout (seconds) used for every tool.sh call and OS-command
# fallback inside iw_get(). Keeps a hung or locked service from stalling
# the whole agent run.
TOOL_TIMEOUT=5

# Free text identifier for "Company name" in the checklist's General
# Information section. Not derived from IceWarp itself. Set per server.
COMPANY_NAME=""

# ---------- Automatic self-update ----------
# Checked before every agent invocation (including --report, --list, --config).
# The updater only fast-forwards when there are no staged or unstaged code
# changes. Unstaged config/*.conf edits are preserved. It never merges,
# rebases, or force-pulls. Set enabled=0 to disable globally.
AUTO_UPDATE_ENABLED=1
AUTO_UPDATE_REMOTE="origin"
AUTO_UPDATE_BRANCH="main"
AUTO_UPDATE_TIMEOUT=60

# Only update when the configured remote resolves to this GitHub repository
# (HTTPS and SSH URL forms are supported). This prevents a checkout from
# silently pulling from an unrelated repository. Leave empty to disable the
# origin check (not recommended).
AUTO_UPDATE_EXPECTED_ORIGIN="kashiparsavan/icewarp-health-agent"

# Re-exec the agent after a successful update so the current process uses
# the new code immediately. Set to 0 only for debugging.
AUTO_UPDATE_REEXEC=1

# Run `bash -n` on the updated tree and roll back if validation fails.
AUTO_UPDATE_VALIDATE=1

# Update activity log (pipe-delimited, append-only). Rotated to .1 when
# it exceeds AUTO_UPDATE_LOG_MAX_BYTES.
AUTO_UPDATE_LOG="${PROJECT_ROOT}/logs/auto_update.log"
AUTO_UPDATE_LOG_MAX_BYTES=5242880
