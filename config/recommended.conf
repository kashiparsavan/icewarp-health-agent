# =============================================================
# IceWarp Recommended Configuration (v14.3.0.12)
# =============================================================
# Format:  key|desired|description
# Keys are the canonical lower-case API names from tool.help.
# Values are raw API values. A few are scaled (see comments).
# =============================================================

# =============================================================
# Backup & Database
# =============================================================
c_system_tools_autobackup_enable|1|Main automatic backup
c_system_tools_autobackup_deleteafter|5|Delete backups older than 5 days
c_system_tools_backup_emails|0|Backup emails (0=disabled)
c_system_tools_backup_db_accountsenabled|1|Accounts DB backup
c_system_tools_backup_db_asenabled|1|Anti-Spam DB backup
c_system_tools_backup_db_gwenabled|1|GroupWare DB backup
c_system_tools_backup_db_directorycacheenabled|0|Directory Cache backup (optional)

# =============================================================
# Archive
# =============================================================
c_system_tools_autoarchive_enable|1|Archive active
c_system_tools_autoarchive_imaparchive|1|Integrate archive with IMAP
c_system_tools_autoarchive_donotspam|1|Do not archive spam
c_system_tools_autoarchive_backup_active|0|Backup deleted messages (optional)

# =============================================================
# Logging
# =============================================================
c_accounts_global_accounts_authlog|4|Auth logging level
c_accounts_global_accounts_maintenancelog|2|Maintenance logging level
c_system_log_mailqueue|4|Mailflow logging level
c_system_sqllogtype|2|SQL log type

# =============================================================
# SMTP Delivery
# =============================================================
c_mail_smtp_delivery_usetlsssl|1|Use TLS/SSL for delivery
c_mail_smtp_delivery_hideip|1|Hide IP in Received header
c_mail_smtp_delivery_hideserverversion|1|Hide server version
c_mail_smtp_delivery_rdnslookup|1|Add rDNS to Received header
c_mail_smtp_delivery_returnpath|1|Add Return-Path
c_mail_smtp_delivery_mdainternal|1|Use MDA for internal delivery
c_mail_smtp_delivery_limitmsgsize|1|Enable max message size
c_mail_smtp_delivery_maxmsgsize|20971520|Max message size (bytes; 20 MB)
c_mail_smtp_delivery_useincomingqueue|1|Use incoming MDA queue
c_mail_smtp_delivery_incomingqueuesize|10|Incoming queue threads
c_system_services_smtp_threadcache|10|Max simultaneous SMTP threads
c_mail_smtp_other_dedupe|1|Dedupe email messages

# =============================================================
# SMTP / Anti-Spam Security
# =============================================================
c_mail_security_protection_heloehlo|1|Require HELO/EHLO
c_mail_security_protection_rejectsmtpauthsender|1|Reject if SMTP AUTH differs from sender
c_mail_security_protection_localdomain|1|Relay only if originator domain is local
c_mail_security_relay_rejectlocalunauth|1|Reject local unauthenticated origins
c_mail_security_protection_rejectrdns|1|Reject if sender IP has no rDNS
c_mail_security_protection_rejectmx|1|Reject if originator domain has no MX
c_mail_security_protection_dnsbl|1|Use DNSBL
c_mail_security_protection_closednsblconn|1|Close connections for DNSBL sessions
c_as_ipreputationuse|1|Use IP reputation
c_as_live_enable|0|Disable AntiSpam Live
c_cloudapi_autoconfigure|0|Disable Cloud API auto-configuration
c_mail_security_protocols_denyvrfy|1|Disable VRFY command

# =============================================================
# Intrusion Prevention (Tarpit)
# =============================================================
c_mail_security_tarpit_enable|1|Enable Intrusion Prevention
c_mail_security_tarpit_enablesmtp|1|Process SMTP
c_mail_security_tarpit_enableimappop3|1|Process POP3/IMAP
c_mail_security_tarpit_blockip|1|Block IP: connections per minute
c_mail_security_tarpit_blockipvalue|10|Block IP: connections per minute value
c_mail_security_tarpit_recipient|1|Block IP: unknown user delivery
c_mail_security_tarpit_recipientcount|5|Block IP: unknown user delivery value
c_mail_security_tarpit_relaytarpit|1|Block IP: relay denied
c_mail_security_tarpit_relaytarpitcount|5|Block IP: relay denied value
c_mail_security_tarpit_rset|1|Block IP: RSET count
c_mail_security_tarpit_rsetcount|5|Block IP: RSET count value
c_mail_security_tarpit_spam|1|Block IP: spam score
c_mail_security_tarpit_spamscore|9216|Spam score raw value (9.00 x 1024)
c_mail_security_tarpit_login|1|Block IP: failed logins
c_mail_security_tarpit_logincount|5|Block IP: failed logins value
c_mail_security_tarpit_dnsbl|1|Block IP: listed on DNSBL
c_mail_security_tarpit_period|30|Block duration (minutes)
c_mail_security_tarpit_closeconnection|1|Close blocked connection
c_mail_security_tarpit_closeallconnections|1|Close all other connections
c_mail_security_tarpit_crosssession|1|Cross-session processing

# =============================================================
# Password Policy
# =============================================================
c_accounts_policies_pass_enable|1|Enable password policy
c_accounts_policies_pass_minlength|10|Min password length
c_accounts_policies_pass_upperalpha|1|Min uppercase characters
c_accounts_policies_pass_digits|1|Min numeric characters
c_accounts_policies_pass_expiration|0|Disable password expiration

# =============================================================
# Login Policy
# =============================================================
c_accounts_policies_login_enable|1|Enable login policy
c_accounts_policies_login_attempts|5|Failed attempts before lock
c_accounts_policies_login_blockperiod|30|Lock period (minutes)

# =============================================================
# Watchdog
# =============================================================
c_system_tools_watchdog_control|1|Watchdog master enable
c_system_tools_watchdog_smtp|1|SMTP watchdog
c_system_tools_watchdog_pop3|1|POP3/IMAP watchdog
c_system_tools_watchdog_im|1|IM/VoIP watchdog
c_system_tools_watchdog_gw|1|GroupWare watchdog
c_system_tools_watchdog_int|0|Watchdog interval (0 = every minute)

# =============================================================
# System Monitor
# =============================================================
c_system_tools_monitor_enable|1|Enable System Monitor
# Raw API stores CPU percentage x 100 (UI 60% = 6000).
c_system_tools_monitor_cpuusageperc|6000|CPU alert threshold (60%)
c_system_tools_monitor_cpuusageperiod|1|CPU threshold period (minutes)
c_system_tools_monitor_disksize|5120|Alert if free disk below (MB)
c_system_tools_monitor_freemem|1048576|Alert if free RAM below (KB)
