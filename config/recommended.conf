# =============================================================
# IceWarp Recommended Configuration (v14.3.0.12)
# =============================================================

# =============================================================
# Backup & Database
# =============================================================
c_system_tools_autobackup_enable|1|Main automatic backup
c_system_tools_autobackup_deleteafter|5|Delete backups older than 5 days
c_system_tools_backup_emails|0|Backup emails (0=disabled)
c_system_tools_backup_db_accountsenabled|1|Accounts DB backup
c_system_tools_backup_db_asenabled|1|Anti-Spam DB backup
c_system_tools_backup_db_gwenabled|1|GroupWare DB backup
c_system_tools_backup_db_directorycacheenabled|0|Directory Cache backup (optional)

# =============================================================
# Archive
# =============================================================
c_system_tools_autoarchive_enable|1|Archive active
c_system_tools_autoarchive_imaparchive|1|Integrate archive with IMAP
c_system_tools_autoarchive_donotspam|1|Do not archive spam
c_system_tools_autoarchive_backup_active|0|Backup deleted messages (optional)

# =============================================================
# Logging
# =============================================================
c_accounts_global_accounts_authlog|4|Auth logging level
c_accounts_maintenancelog|2|Maintenance log level
c_system_log_mailqueue|4|Mailflow log level
c_system_sqllogtype|2|SQL log type

# =============================================================
# SMTP Delivery & Hardening
# =============================================================
c_mail_smtp_delivery_hideip|1|Hide IP in Received header
c_mail_smtp_delivery_hideserverversion|1|Hide server version
c_mail_smtp_delivery_rdnslookup|1|Add rDNS to Received header
c_mail_smtp_delivery_returnpath|1|Add Return-Path
c_mail_smtp_delivery_mdainternal|1|Use MDA for internal delivery

# =============================================================
# Security (Protocols & Auth)
# =============================================================
c_mail_security_protocols_denyvrfy|1|Disable VRFY command

# =============================================================
# Security (Intrusion Prevention - Tarpit)
# =============================================================
c_mail_security_tarpit_enable|1|Enable Intrusion Prevention
c_mail_security_tarpit_connections|10|Block IP: Connections per minute
c_mail_security_tarpit_unknownuser|5|Block IP: Unknown user delivery
c_mail_security_tarpit_relaydenied|5|Block IP: Relay denied
c_mail_security_tarpit_rsetcount|5|Block IP: RSET count
c_mail_security_tarpit_spamscore|9216|Block IP: Spam score (9.00)
c_mail_security_tarpit_failedlogins|5|Block IP: Failed logins
c_mail_security_tarpit_duration|30|Amount of time IP is blocked (min)

# =============================================================
# Password Policy
# =============================================================
c_accounts_policies_pass_enable|1|Password policy active
c_accounts_policies_pass_minlength|10|Min password length (>=8)
c_accounts_policies_pass_expiration|0|Expiration active (0=disabled)

# =============================================================
# Watchdog
# =============================================================
c_system_tools_watchdog_control|1|Watchdog master enable
c_system_tools_watchdog_smtp|1|SMTP watchdog
c_system_tools_watchdog_pop3|1|POP3/IMAP watchdog
c_system_tools_watchdog_im|1|IM/VoIP watchdog
c_system_tools_watchdog_gw|1|GroupWare watchdog
