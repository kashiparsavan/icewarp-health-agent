/* ============================================================
   RENDER TABLE
   ============================================================ */
const tbody = document.getElementById('tbody');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('search');

function typeClass(t) {
  switch (t.toLowerCase()) {
    case 'bool': return 'type-bool';
    case 'int': return 'type-int';
    case 'string': return 'type-string';
    case 'enum': return 'type-enum';
    case 'schedule': return 'type-schedule';
    default: return 'type-string';
  }
}

function render(data) {
  tbody.innerHTML = '';
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:2rem;color:#94a3b8;">No matching keys found.</td></tr>';
    countEl.textContent = '0 keys';
    return;
  }
  data.forEach(([name, type, access, desc]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="name">${name}</td>
      <td><span class="type ${typeClass(type)}">${type}</span></td>
      <td class="access ${access === 'r/o' ? 'access-ro' : access === 'r' ? 'access-r' : ''}">${access || '—'}</td>
      <td class="desc">${desc || '—'}</td>
    `;
    tbody.appendChild(tr);
  });
  countEl.textContent = data.length + ' keys';
}

/* ============================================================
   SEARCH
   ============================================================ */
let sortCol = -1, sortAsc = true;
let currentData = [...DATA];

function filterAndRender() {
  const q = searchInput.value.trim().toLowerCase();
  let filtered = DATA;
  if (q) {
    filtered = DATA.filter(row =>
      row[0].toLowerCase().includes(q) ||
      row[1].toLowerCase().includes(q) ||
      (row[3] || '').toLowerCase().includes(q) ||
      (row[2] || '').toLowerCase().includes(q)
    );
  }
  if (sortCol >= 0) {
    filtered = [...filtered].sort((a, b) => {
      const va = (a[sortCol] || '').toString().toLowerCase();
      const vb = (b[sortCol] || '').toString().toLowerCase();
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
  }
  currentData = filtered;
  render(filtered);
}

searchInput.addEventListener('input', filterAndRender);

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = parseInt(th.dataset.col, 10);
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = true;
    }
    // update arrows
    document.querySelectorAll('thead th .arrow').forEach(a => a.textContent = '↕');
    th.querySelector('.arrow').textContent = sortAsc ? '↑' : '↓';
    filterAndRender();
  });
});

/* ============================================================
   INITIAL RENDER
   ============================================================ */
filterAndRender();
</script>
